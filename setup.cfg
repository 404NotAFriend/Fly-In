[flake8]
# O subject exige aderência ao standard flake8.
# Excluímos as pastas que não contêm código relevante para evitar falsos positivos.
max-line-length = 79
exclude = .git, __pycache__, venv, .mypy_cache, .vscode, maps

[mypy]
# Requisito do subject: Python 3.10 ou superior
python_version = 3.10

# Flags exigidas para a regra "lint" obrigatória
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True


mypy_path = src
namespace_packages = True
explicit_package_bases = True

#(?x) liga o "modo verbose" da regex
# Ignorar as pastas de ambiente e cache
exclude = (?x)(
    ^venv/
    | ^\.mypy_cache/
    | ^__pycache__/
  )
